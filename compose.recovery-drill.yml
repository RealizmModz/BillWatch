name: billwatch-recovery-drill

x-logging: &default-logging
  driver: json-file
  options:
    max-file: "3"
    max-size: 10m

services:
  restore-database:
    image: postgres:17-alpine
    restart: "no"
    stop_grace_period: 30s
    environment:
      POSTGRES_DB: restore_host
      POSTGRES_USER: billwatch
      POSTGRES_PASSWORD: ${BILLWATCH_DATABASE_PASSWORD:?Set BILLWATCH_DATABASE_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data:rw,nosuid,nodev,size=${BILLWATCH_BACKUP_WORK_SIZE:-8g}
    networks:
      - recovery_data
    logging: *default-logging

  verifier:
    image: billwatch-recovery-verifier:${BILLWATCH_RELEASE_ID:?Set BILLWATCH_RELEASE_ID}
    build:
      context: ./deploy/backup
      dockerfile: Dockerfile
      args:
        BILLWATCH_RELEASE_ID: ${BILLWATCH_RELEASE_ID:?Set BILLWATCH_RELEASE_ID}
    restart: "no"
    read_only: true
    user: "1654:1654"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      PGPASSWORD: ${BILLWATCH_DATABASE_PASSWORD:?Set BILLWATCH_DATABASE_PASSWORD}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:?Set RESTIC_REPOSITORY}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?Set RESTIC_PASSWORD}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      BILLWATCH_ALLOW_LOCAL_BACKUP_REPOSITORY: "false"
      BILLWATCH_RELEASE_ID: ${BILLWATCH_RELEASE_ID:?Set BILLWATCH_RELEASE_ID}
      BILLWATCH_REQUIRE_RECOVERY_FIXTURE: ${BILLWATCH_REQUIRE_RECOVERY_FIXTURE:-false}
      RESTORE_DATABASE_HOST: restore-database
    tmpfs:
      - /work:rw,noexec,nosuid,nodev,size=${BILLWATCH_BACKUP_WORK_SIZE:-8g},uid=1654,gid=1654,mode=0700
    networks:
      - recovery_data
      - recovery_egress
    logging: *default-logging

networks:
  recovery_data:
    internal: true
  recovery_egress:
