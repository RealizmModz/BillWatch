name: BillWatch CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: billwatch-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore tests and dependencies
        run: dotnet restore BillWatch.Tests/BillWatch.Tests.csproj

      - name: Build backend
        run: dotnet build BillWatch.Tests/BillWatch.Tests.csproj --configuration Release --no-restore

      - name: Install EF migration verifier
        run: dotnet tool install --global dotnet-ef --version 10.0.11

      - name: Verify committed migrations match the model
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__BillWatchDatabase: Host=localhost;Database=billwatch_ci_model_check;Username=billwatch;Password=ci-model-check-only
          Plaid__Environment: sandbox
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project BillWatch.API/BillWatch.API.csproj
          --startup-project BillWatch.API/BillWatch.API.csproj
          --no-build
          --configuration Release

      - name: Run tests
        run: dotnet test BillWatch.Tests/BillWatch.Tests.csproj --configuration Release --no-build --no-restore

  container:
    name: Linux production container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ACME_EMAIL: ci@example.com
      BILLWATCH_ALLOW_LOCAL_BACKUP_REPOSITORY: "true"
      BILLWATCH_BACKUP_WORK_SIZE: 1g
      BILLWATCH_DATABASE_PASSWORD: ci-only-password
      BILLWATCH_HOST: localhost
      BILLWATCH_WEB_HOST: web.localhost
      BILLWATCH_RELEASE_ID: ${{ github.sha }}
      BILLWATCH_REQUIRE_RECOVERY_FIXTURE: "true"
      PLAID_CLIENT_ID: ci-client
      PLAID_ENVIRONMENT: sandbox
      PLAID_SECRET: ci-secret
      RESTIC_PASSWORD: ci-restic-password-32-characters
      RESTIC_REPOSITORY: /repository

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate production operation scripts
        run: |
          sh deploy/tests/production-operations-tests.sh
          sh deploy/tests/release-integrity-tests.sh
          sh deploy/tests/runtime-release-tests.sh
          sh deploy/tests/http-security-boundary-tests.sh
          sh deploy/tests/runtime-watchdog-tests.sh

      - name: Validate beta readiness scripts
        run: |
          sh deploy/tests/beta-readiness-tests.sh
          sh deploy/tests/reboot-recovery-drill-tests.sh

      - name: Configure container builder
        uses: docker/setup-buildx-action@v4

      - name: Build production API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: billwatch-api:${{ github.sha }}
          build-args: |
            BILLWATCH_RELEASE_ID=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build production web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.web
          load: true
          push: false
          tags: billwatch-web:${{ github.sha }}
          build-args: |
            BILLWATCH_RELEASE_ID=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Start production stack
        run: docker compose --file compose.production.yml up --detach --no-build

      - name: Verify API HTTPS readiness
        run: curl --fail --insecure --retry 30 --retry-all-errors --retry-delay 2 https://localhost/health/ready

      - name: Verify web HTTPS readiness
        run: curl --fail --insecure --retry 30 --retry-all-errors --retry-delay 2 --resolve web.localhost:443:127.0.0.1 https://web.localhost/health/ready

      - name: Verify production HTTP security boundaries
        env:
          BILLWATCH_HTTP_SECURITY_ALLOW_INSECURE: "true"
        run: >-
          sh deploy/check-http-security-boundaries.sh
          https://localhost
          https://web.localhost

      - name: Seed protected recovery fixture
        shell: bash
        run: |
          set -euo pipefail
          email="ci-recovery-${GITHUB_RUN_ID}@billwatch.local"
          password='BillWatch!CiRecovery123'
          curl --fail --silent --show-error --insecure \
            --request POST https://localhost/api/auth/register \
            --header 'Content-Type: application/json' \
            --data "{\"email\":\"${email}\",\"password\":\"${password}\",\"acceptedTermsAndPrivacy\":true,\"legalTermsVersion\":\"2026-09-04-beta\"}" \
            >/dev/null
          login_json="$(curl --fail --silent --show-error --insecure \
            --request POST https://localhost/api/auth/login \
            --header 'Content-Type: application/json' \
            --data "{\"email\":\"${email}\",\"password\":\"${password}\"}")"
          access_token="$(jq --exit-status --raw-output '.accessToken' <<<"${login_json}")"
          stream_json="$(curl --fail --silent --show-error --insecure \
            --request POST https://localhost/api/bill-streams \
            --header "Authorization: Bearer ${access_token}" \
            --header 'Content-Type: application/json' \
            --data '{"providerName":"CI Recovery Provider","category":"Utility"}')"
          stream_id="$(jq --exit-status --raw-output '.id' <<<"${stream_json}")"
          printf '%%PDF-1.4\n%% CI recovery fixture\n%%%%EOF\n' > /tmp/billwatch-recovery-fixture.pdf
          curl --fail --silent --show-error --insecure \
            --request POST "https://localhost/api/bill-streams/${stream_id}/statement-uploads" \
            --header "Authorization: Bearer ${access_token}" \
            --form 'file=@/tmp/billwatch-recovery-fixture.pdf;type=application/pdf' \
            >/dev/null
          docker compose --file compose.production.yml exec --no-TTY api sh -c \
            'test -n "$(find /var/lib/billwatch/keys -type f -name "key-*.xml" -size +0c -print -quit)"'
          docker compose --file compose.production.yml exec --no-TTY api sh -c \
            'test -n "$(find /var/lib/billwatch/statements -type f -size +0c -print -quit)"'

      - name: Build recovery image
        run: docker compose --profile operations --file compose.production.yml build backup

      - name: Verify production image release revisions
        shell: bash
        run: |
          set -euo pipefail
          for image in \
            "billwatch-api:${BILLWATCH_RELEASE_ID}" \
            "billwatch-web:${BILLWATCH_RELEASE_ID}" \
            "billwatch-backup:${BILLWATCH_RELEASE_ID}"
          do
            revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "${image}")"
            test "${revision}" = "${BILLWATCH_RELEASE_ID}"
          done

      - name: Initialize encrypted backup repository
        run: docker compose --profile operations --file compose.production.yml run --rm backup init

      - name: Create consistent encrypted backup
        run: sh deploy/run-backup.sh "$PWD"

      - name: Prove isolated database and file restore
        run: |
          docker compose --profile operations --file compose.production.yml up --detach --wait restore-database
          docker compose --profile operations --file compose.production.yml run --rm backup verify
          docker compose --profile operations --file compose.production.yml stop restore-database

      - name: Verify API recovery after backup
        run: curl --fail --insecure --retry 30 --retry-all-errors --retry-delay 2 https://localhost/health/ready

      - name: Print sanitized container logs on failure
        if: failure()
        run: docker compose --profile operations --file compose.production.yml logs --no-color --tail 200

      - name: Stop production stack
        if: always()
        run: docker compose --profile operations --file compose.production.yml down --volumes
