name: BillWatch Production Readiness

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force_failure:
        description: "Intentionally fail after successful probes to test alert delivery"
        required: false
        default: false
        type: boolean

concurrency:
  group: billwatch-production-readiness
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  readiness:
    name: External readiness — ${{ matrix.target.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 3

    strategy:
      fail-fast: false
      matrix:
        target:
          - name: API
            url: https://api.billbeacon.net
          - name: Web
            url: https://billbeacon.net

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Probe production from outside the deployment host
        env:
          BILLWATCH_PRODUCTION_URL: ${{ matrix.target.url }}
        run: sh deploy/monitor-readiness.sh

      - name: Controlled alert-delivery drill
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.force_failure && matrix.target.name == 'API' }}
        run: |
          echo "Intentional BillWatch readiness failure drill."
          exit 1

      - name: Deliver independent readiness failure alert
        if: ${{ failure() }}
        env:
          BILLWATCH_READINESS_ALERT_WEBHOOK_URL: ${{ secrets.BILLWATCH_READINESS_ALERT_WEBHOOK_URL }}
        run: >-
          sh deploy/send-readiness-alert.sh
          readiness-failed
          '${{ matrix.target.name }}'
          '${{ github.run_id }}'
